(()=>{'use strict';const frames=[...document.querySelectorAll('.frame')],move=document.getElementById('move'),retry=document.getElementById('retry');let timers=[],busy=false;function show(n){frames.forEach((im,i)=>im.hidden=i!==n)}function reset(){timers.forEach(clearTimeout);timers=[];busy=false;show(0);move.hidden=false;retry.hidden=true}move.addEventListener('click',()=>{if(busy)return;busy=true;move.hidden=true;show(1);timers.push(setTimeout(()=>show(2),1000));timers.push(setTimeout(()=>{show(3);retry.hidden=false},2000))});retry.addEventListener('click',reset);
