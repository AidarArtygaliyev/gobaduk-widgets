<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Го 25–46</title>
<style>body{margin:0;padding:18px;background:#f4efe5;font-family:Arial;text-align:center}.w{max-width:720px;margin:auto}canvas{width:100%;height:auto;display:block;background:#d9aa53;box-shadow:0 4px 16px #0002}.c{margin-top:16px;display:flex;gap:12px;justify-content:center}button{border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}#n{background:#356f43}#r{background:#777}button:disabled{opacity:.45}#s{margin-top:10px;min-height:24px;font-weight:700}</style></head>
<body><div class="w"><canvas id="b" width="760" height="760"></canvas><div class="c"><button id="n">Следующий ход</button><button id="r">Сначала</button></div><div id="s">Нажмите «Следующий ход» — появится камень 25.</div></div>
<script>
const b=document.getElementById("b"),x=b.getContext("2d"),n=document.getElementById("n"),r=document.getElementById("r"),s=document.getElementById("s"),N=13;
const I=[[4,1,"B"],[4,2,"B"],[4,3,"B"],[4,4,"B"],[4,5,"B"],[4,6,"B"],[4,7,"B"],[4,8,"B"],[4,9,"B"],[4,10,"B"],[5,1,"W"],[5,2,"W"],[5,3,"W"],[5,10,"B"],[6,10,"B"],[6,9,"W"],[7,10,"W"],[8,10,"W"],[6,11,"W"],[6,6,"W"],[7,6,"W"],[8,6,"W"],[9,3,"W"],[9,9,"W"]];
const M=[[10,6,"B",25],[10,3,"W",26],[10,8,"B",27],[10,9,"W",28],[9,7,"B",29],[9,6,"W",30],[8,7,"B",31],[7,7,"W",32],[10,5,"B",33],[8,8,"W",34],[10,4,"B",35],[9,8,"W",36],[10,7,"B",37],[11,4,"W",38],[11,9,"B",39],[11,10,"W",40],[12,9,"B",41],[12,10,"W",42],[11,7,"B",43],[11,5,"W",44],[12,7,"B",45],[11,6,"W",46]];
let k=0;
function mt(){let z=b.width,p=z*.035,c=(z-2*p)/(N-1);return{z,p,c}}function q(a,d){let{p,c}=mt();return{x:p+a*c,y:p+d*c}}
function db(){let{z,p,c}=mt(),g=x.createLinearGradient(0,0,z,z);g.addColorStop(0,"#e7c16e");g.addColorStop(1,"#cf9b45");x.fillStyle=g;x.fillRect(0,0,z,z);x.strokeStyle="#15110d";x.lineWidth=2;for(let i=0;i<N;i++){let v=p+i*c;x.beginPath();x.moveTo(p,v);x.lineTo(z-p,v);x.stroke();x.beginPath();x.moveTo(v,p);x.lineTo(v,z-p);x.stroke()}x.fillStyle="#15110d";[[3,3],[3,9],[6,6],[9,3],[9,9]].forEach(([a,d])=>{let v=q(a,d);x.beginPath();x.arc(v.x,v.y,c*.075,0,7);x.fill()})}
function st(a,d,col,num){let{c}=mt(),v=q(a,d),R=c*.47,g=x.createRadialGradient(v.x-R*.35,v.y-R*.38,R*.08,v.x,v.y,R);if(col==="B"){g.addColorStop(0,"#555");g.addColorStop(.3,"#222");g.addColorStop(1,"#050505")}else{g.addColorStop(0,"#fff");g.addColorStop(.55,"#f7f7f7");g.addColorStop(1,"#d2d2d2")}x.save();x.shadowColor="#0006";x.shadowBlur=c*.12;x.beginPath();x.arc(v.x,v.y,R,0,7);x.fillStyle=g;x.fill();x.restore();if(num){x.fillStyle=col==="B"?"#fff":"#111";x.font=Math.round(c*.55)+"px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText(num,v.x,v.y)}}
function go(){db();I.forEach(v=>st(...v));for(let i=0;i<k;i++)st(...M[i]);n.disabled=k===M.length;s.textContent=k===0?'Нажмите «Следующий ход» — появится камень 25.':k<M.length?`Показан ход ${M[k-1][3]}. Следующий — ${M[k][3]}.`:"Показана вся последовательность ходов 25–46."}
n.onclick=()=>{if(k<M.length){k++;go()}};r.onclick=()=>{k=0;go()};go();
</script></body></html>
